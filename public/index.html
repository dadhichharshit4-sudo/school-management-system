<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>स्कूल मैनेजमेंट सिस्टम</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #eef2f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .mobile-frame { 
      width: 100%; 
      max-width: 430px; 
      height: 100vh; 
      max-height: 880px; 
      background: #f8fafc; 
      display: flex; 
      flex-direction: column; 
      position: relative;
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
      border-radius: 24px;
      overflow: hidden;
    }

    @media (max-width: 480px) {
      .mobile-frame { height: 100vh; max-height: 100vh; border-radius: 0; }
      body { background: #fff; }
    }

    .app-header {
      background: linear-gradient(135deg, #1a73e8, #0d47a1);
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 10px rgba(26, 115, 232, 0.2);
    }
    .app-header h3 { font-size: 18px; font-weight: 700; }
    .logout-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; }

    .app-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 85px 16px;
    }

    .bottom-nav {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 65px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.04);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #64748b;
      font-size: 11px;
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      gap: 3px;
    }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    .nav-item.active { color: #1a73e8; }

    .user-pill {
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 14px;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #edf2f7;
    }
    .card-title { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 10px; }

    .form-control { width: 100%; padding: 11px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; margin-bottom: 10px; outline: none; background: #fff; }
    .btn-action { width: 100%; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 700; color: white; cursor: pointer; transition: 0.2s; }
    .btn-blue { background: #1a73e8; }
    .btn-green { background: #16a34a; }
    .btn-orange { background: #ea580c; }

    .notice-item {
      background: #ffffff;
      border-left: 4px solid #1a73e8;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .notice-item h4 { color: #1a73e8; font-size: 15px; margin-bottom: 4px; }
    .notice-item p { color: #475569; font-size: 13px; line-height: 1.4; }
    .notice-item .date { color: #94a3b8; font-size: 11px; margin-top: 6px; text-align: right; }

    .list-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 8px;
      border: 1px solid #f1f5f9;
    }
    .status-badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    .badge-paid { background: #dcfce7; color: #15803d; }
    .badge-partial { background: #fef9c3; color: #a16207; }
    .badge-pending { background: #fee2e2; color: #b91c1c; }

    /* प्रोग्रेस बार */
    .progress-bar-container {
      background: #e2e8f0;
      border-radius: 10px;
      height: 8px;
      width: 100%;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      height: 100%;
      background: #16a34a;
      border-radius: 10px;
      transition: width 0.3s;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="mobile-frame">
  <!-- लॉगिन स्क्रीन -->
  <div id="login-screen" style="flex: 1; display: flex; flex-direction: column;">
    <div class="app-header" style="justify-content: center; padding: 28px 20px;">
      <div style="text-align: center;">
        <h3 style="font-size: 20px;">स्कूल मैनेजमेंट सिस्टम</h3>
        <p style="font-size: 12px; opacity: 0.9; margin-top: 4px;">Admin • Teacher • Student Portal</p>
      </div>
    </div>
    <div class="app-body" style="padding: 24px;">
      <div class="card" style="margin-top: 20px;">
        <label style="font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 6px; display: block;">ईमेल आईडी</label>
        <input type="email" id="login-email" class="form-control" value="admin@school.com">

        <label style="font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 6px; display: block;">पासवर्ड</label>
        <input type="password" id="login-password" class="form-control" value="admin123">

        <button class="btn-action btn-blue" style="margin-top: 8px;" onclick="handleLogin()">लॉगिन करें</button>
        <p id="login-msg" style="color: #dc2626; font-size: 13px; text-align: center; margin-top: 10px;"></p>
      </div>
    </div>
  </div>

  <!-- मेन ऐप स्क्रीन -->
  <div id="dashboard-screen" class="hidden" style="flex: 1; display: flex; flex-direction: column; height: 100%;">
    <div class="app-header">
      <h3 id="welcome-name">डैशबोर्ड</h3>
      <button class="logout-btn" onclick="handleLogout()">लॉगआउट</button>
    </div>

    <div class="app-body">
      <div id="user-role-badge" class="user-pill"></div>

      <!-- टैब 1: नोटिस बोर्ड -->
      <div id="section-notices">
        <div id="create-notice-section" class="card hidden" style="border: 1px dashed #ea580c; background: #fffaf5;">
          <div class="card-title" style="color: #ea580c;">+ नया नोटिस जारी करें</div>
          <input type="text" id="new-notice-title" class="form-control" placeholder="नोटिस शीर्षक">
          <textarea id="new-notice-desc" class="form-control" rows="2" placeholder="नोटिस का विवरण..."></textarea>
          <button class="btn-action btn-orange" onclick="handleCreateNotice()">नोटिस पोस्ट करें</button>
        </div>
        <div class="card-title">स्कूल नोटिस बोर्ड</div>
        <div id="notices-container">लोड हो रहा है...</div>
      </div>

      <!-- टैब 2: अटेंडेंस -->
      <div id="section-attendance" class="hidden">
        <div id="add-student-section" class="card hidden" style="border: 1px dashed #1a73e8; background: #f8fafc;">
          <div class="card-title" style="color: #1a73e8;">+ नया छात्र प्रवेश</div>
          <input type="number" id="new-stud-roll" class="form-control" placeholder="रोल नंबर">
          <input type="text" id="new-stud-name" class="form-control" placeholder="छात्र का नाम">
          <input type="text" id="new-stud-class" class="form-control" value="Class 10-A" placeholder="कक्षा">
          <input type="number" id="new-stud-fee" class="form-control" value="20000" placeholder="कुल वार्षिक फीस">
          <button class="btn-action btn-blue" onclick="handleAddStudent()">छात्र सेव करें</button>
          <p id="student-add-msg" style="font-size: 12px; margin-top: 6px; text-align: center;"></p>
        </div>

        <!-- उपस्थिति रिपोर्ट / प्रतिशत सारांश -->
        <div class="card" style="border-top: 3px solid #16a34a;">
          <div class="card-title" style="color: #16a34a; margin-bottom: 6px;">📊 उपस्थिति प्रतिशत रिपोर्ट</div>
          <div id="attendance-summary-container">लोड हो रहा है...</div>
        </div>

        <div class="card-title" id="att-heading">दैनिक हाजिरी दर्ज करें</div>
        <div id="students-list">लोड हो रहा है...</div>
        <div id="att-submit-box">
          <button class="btn-action btn-green" style="margin-top: 8px;" onclick="submitAttendance()">हाजिरी सबमिट करें</button>
          <p id="att-msg" style="font-size: 13px; margin-top: 8px; text-align: center;"></p>
        </div>
      </div>

      <!-- टैब 3: फीस -->
      <div id="section-fees" class="hidden">
        <div class="card-title" id="fee-heading">फीस विवरण</div>
        <div id="fees-container">लोड हो रहा है...</div>
      </div>
    </div>

    <!-- बॉटम नेविगेशन बार -->
    <div class="bottom-nav">
      <button id="nav-btn-notices" class="nav-item active" onclick="switchTab('notices')">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
        नोटिस
      </button>
      <button id="nav-btn-attendance" class="nav-item" onclick="switchTab('attendance')">
        <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
        हाजिरी
      </button>
      <button id="nav-btn-fees" class="nav-item" onclick="switchTab('fees')">
        <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        फीस
      </button>
    </div>
  </div>
</div>

<script>
  let currentUser = null;
  let studentsData = [];

  async function handleLogin() {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        currentUser = data.user;
        showDashboard(data.user);
      } else {
        document.getElementById('login-msg').innerText = data.error || 'लॉगिन विफल!';
      }
    } catch {
      document.getElementById('login-msg').innerText = 'सर्वर से कनेक्शन विफल!';
    }
  }

  function showDashboard(user) {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('dashboard-screen').classList.remove('hidden');
    document.getElementById('welcome-name').innerText = user.name;
    document.getElementById('user-role-badge').innerText = `रोल: ${user.role.toUpperCase()}`;

    if (user.role === 'admin') {
      document.getElementById('create-notice-section').classList.remove('hidden');
      document.getElementById('add-student-section').classList.remove('hidden');
      document.getElementById('att-submit-box').classList.remove('hidden');
      document.getElementById('att-heading').innerText = 'दैनिक हाजिरी दर्ज करें';
      document.getElementById('fee-heading').innerText = 'सभी छात्र फीस रिकॉर्ड (Admin)';
    } else if (user.role === 'teacher') {
      document.getElementById('create-notice-section').classList.remove('hidden');
      document.getElementById('add-student-section').classList.add('hidden');
      document.getElementById('att-submit-box').classList.remove('hidden');
      document.getElementById('att-heading').innerText = 'दैनिक हाजिरी दर्ज करें';
      document.getElementById('fee-heading').innerText = 'सभी छात्र फीस रिकॉर्ड';
    } else {
      document.getElementById('create-notice-section').classList.add('hidden');
      document.getElementById('add-student-section').classList.add('hidden');
      document.getElementById('att-submit-box').classList.add('hidden');
      document.getElementById('att-heading').classList.add('hidden');
      document.getElementById('fee-heading').innerText = 'मेरी फीस का विवरण';
    }

    loadNotices();
    loadStudents();
    loadAttendanceSummary();
    loadFees();
  }

  function switchTab(tab) {
    ['notices', 'attendance', 'fees'].forEach(t => {
      document.getElementById(`section-${t}`).classList.add('hidden');
      document.getElementById(`nav-btn-${t}`).classList.remove('active');
    });
    document.getElementById(`section-${tab}`).classList.remove('hidden');
    document.getElementById(`nav-btn-${tab}`).classList.add('active');
  }

  async function loadNotices() {
    const container = document.getElementById('notices-container');
    const res = await fetch('/api/notices');
    const notices = await res.json();
    container.innerHTML = '';
    notices.forEach(n => {
      const d = new Date(n.date).toLocaleDateString('hi-IN');
      container.innerHTML += `
        <div class="notice-item">
          <h4>${n.title}</h4>
          <p>${n.description}</p>
          <div class="date">दिनांक: ${d}</div>
        </div>`;
    });
  }

  async function handleCreateNotice() {
    const title = document.getElementById('new-notice-title').value.trim();
    const description = document.getElementById('new-notice-desc').value.trim();
    if (!title || !description) return;
    const res = await fetch('/api/notices', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, description })
    });
    if (res.ok) {
      document.getElementById('new-notice-title').value = '';
      document.getElementById('new-notice-desc').value = '';
      loadNotices();
    }
  }

  async function loadStudents() {
    const container = document.getElementById('students-list');
    try {
      const res = await fetch('/api/students');
      studentsData = await res.json();
      container.innerHTML = '';

      let listToShow = studentsData;
      if (currentUser && currentUser.role === 'student') {
        listToShow = studentsData.filter(s => s.name.toLowerCase() === currentUser.name.toLowerCase());
      }

      listToShow.forEach(s => {
        container.innerHTML += `
          <div class="list-row">
            <div>
              <strong style="color: #1e293b; font-size: 14px;">${s.name}</strong><br>
              <span style="font-size: 11px; color: #64748b;">रोल: ${s.roll_no} • ${s.class_name}</span>
            </div>
            ${currentUser.role !== 'student' ? `
              <div>
                <label style="font-size: 13px; font-weight:600; cursor:pointer;"><input type="radio" name="att_${s.id}" value="Present" checked> P</label>
                <label style="font-size: 13px; font-weight:600; margin-left: 10px; cursor:pointer;"><input type="radio" name="att_${s.id}" value="Absent"> A</label>
              </div>
            ` : `<span class="status-badge badge-paid">नामांकित</span>`}
          </div>`;
      });
    } catch {
      container.innerHTML = 'छात्र लोड नहीं हो सके!';
    }
  }

  async function loadAttendanceSummary() {
    const container = document.getElementById('attendance-summary-container');
    try {
      const res = await fetch('/api/attendance/report');
      const reports = await res.json();
      container.innerHTML = '';

      let listToShow = reports;
      if (currentUser && currentUser.role === 'student') {
        listToShow = reports.filter(r => r.name.toLowerCase() === currentUser.name.toLowerCase());
      }

      if (listToShow.length === 0) {
        container.innerHTML = '<p style="font-size: 12px; color: #94a3b8;">कोई रिकॉर्ड उपलब्ध नहीं है।</p>';
        return;
      }

      listToShow.forEach(r => {
        const color = r.percentage >= 75 ? '#16a34a' : (r.percentage >= 50 ? '#ca8a04' : '#dc2626');
        container.innerHTML += `
          <div style="margin-bottom: 12px;">
            <div style="display:flex; justify-content:space-between; font-size:13px;">
              <strong>${r.name} (${r.roll_no})</strong>
              <span style="font-weight:700; color:${color};">${r.percentage}% (${r.present_days}/${r.total_days} दिन)</span>
            </div>
            <div class="progress-bar-container">
              <div class="progress-fill" style="width: ${r.percentage}%; background: ${color};"></div>
            </div>
          </div>
        `;
      });
    } catch {
      container.innerHTML = 'रिपोर्ट लोड करने में त्रुटि!';
    }
  }

  async function handleAddStudent() {
    const roll_no = document.getElementById('new-stud-roll').value;
    const name = document.getElementById('new-stud-name').value.trim();
    const class_name = document.getElementById('new-stud-class').value.trim();
    const total_fees = document.getElementById('new-stud-fee').value;
    const msg = document.getElementById('student-add-msg');

    if (!roll_no || !name || !class_name) {
      msg.style.color = '#dc2626';
      msg.innerText = 'कृपया सभी विवरण भरें!';
      return;
    }

    try {
      const res = await fetch('/api/students', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ roll_no, name, class_name, total_fees })
      });
      const data = await res.json();
      if (res.ok) {
        msg.style.color = '#16a34a';
        msg.innerText = data.message;
        document.getElementById('new-stud-roll').value = '';
        document.getElementById('new-stud-name').value = '';
        loadStudents();
        loadAttendanceSummary();
        loadFees();
      } else {
        msg.style.color = '#dc2626';
        msg.innerText = data.error;
      }
    } catch {
      msg.style.color = '#dc2626';
      msg.innerText = 'त्रुटि हुई!';
    }
  }

  async function submitAttendance() {
    const attendanceData = studentsData.map(s => ({
      student_id: s.id,
      status: document.querySelector(`input[name="att_${s.id}"]:checked`).value
    }));
    const msg = document.getElementById('att-msg');
    try {
      const res = await fetch('/api/attendance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ attendanceData })
      });
      const data = await res.json();
      msg.style.color = res.ok ? '#16a34a' : '#dc2626';
      msg.innerText = data.message || data.error;
      loadAttendanceSummary();
    } catch {
      msg.style.color = '#dc2626';
      msg.innerText = 'हाजिरी सबमिट विफल!';
    }
  }

  async function loadFees() {
    const container = document.getElementById('fees-container');
    try {
      const res = await fetch('/api/fees');
      const fees = await res.json();
      container.innerHTML = '';

      let listToShow = fees;
      if (currentUser && currentUser.role === 'student') {
        listToShow = fees.filter(f => f.name.toLowerCase() === currentUser.name.toLowerCase());
      }

      listToShow.forEach(f => {
        const pending = Number(f.total_amount) - Number(f.paid_amount);
        let badgeClass = 'badge-pending';
        let badgeText = 'बकाया';
        if (f.status === 'Paid') { badgeClass = 'badge-paid'; badgeText = 'पूर्ण जमा'; }
        else if (f.status === 'Partial') { badgeClass = 'badge-partial'; badgeText = 'आंशिक जमा'; }

        container.innerHTML += `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong style="color: #1e293b;">${f.name} (रोल: ${f.roll_no})</strong>
              <span class="status-badge ${badgeClass}">${badgeText}</span>
            </div>
            <div style="font-size: 13px; color: #64748b; margin-top: 8px;">
              कुल: ₹${f.total_amount} | जमा: ₹${f.paid_amount} | <strong style="color: #dc2626;">बकाया: ₹${pending}</strong>
            </div>
            ${currentUser.role !== 'student' && pending > 0 ? `
              <div style="display:flex; gap:8px; margin-top:10px;">
                <input type="number" id="pay_amt_${f.student_id}" class="form-control" placeholder="राशि" style="margin-bottom:0; padding:8px 10px; font-size:13px;">
                <button class="btn-action btn-blue" style="width: auto; padding: 8px 16px;" onclick="payFee(${f.student_id})">जमा करें</button>
              </div>
            ` : ''}
          </div>`;
      });
    } catch {
      container.innerHTML = 'फीस लोड करने में त्रुटि!';
    }
  }

  async function payFee(studentId) {
    const input = document.getElementById(`pay_amt_${studentId}`);
    const amount = input.value;
    if (!amount || amount <= 0) return alert('वैध राशि दर्ज करें!');

    const res = await fetch('/api/fees/pay', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ student_id: studentId, amount })
    });
    if (res.ok) {
      loadFees();
    } else {
      alert('भुगतान रिकॉर्ड विफल!');
    }
  }

  function handleLogout() {
    currentUser = null;
