      if (moduleName === 'login') {
        container.innerHTML = `
          <div class="login-container">

    function updateRowStatus(id, val) {
      if (markingMap[id]) markingMap[id].status = val;
      const sel = document.getElementById(`m-status-${id}`);
      if (sel) {
        sel.style.color = val === 'Present' ? '#15803d' : (val === 'Absent' ? '#dc2626' : '#0284c7');
      }
      refreshMarkingCounts();
    }

    function setAllMarking(st) {
      Object.keys(markingMap).forEach(id => {
        markingMap[id].status = st;
        const sel = document.getElementById(`m-status-${id}`);
        const rem = document.getElementById(`m-remark-${id}`);
        if (sel) {
          sel.value = st;
          sel.style.color = st === 'Present' ? '#15803d' : (st === 'Absent' ? '#dc2626' : '#0284c7');
        }
        if (rem && st !== 'Holiday') rem.value = '';
      });
      refreshMarkingCounts();
    }

    function declareHolidayAll() {
      const reason = prompt("अवकाश का विवरण लिखें:", "रविवार (Sunday)");
      if (!reason) return;
      Object.keys(markingMap).forEach(id => {
        markingMap[id].status = 'Holiday';
        markingMap[id].remarks = reason;
        const sel = document.getElementById(`m-status-${id}`);
        const rem = document.getElementById(`m-remark-${id}`);
        if (sel) { sel.value = 'Holiday'; sel.style.color = '#0284c7'; }
        if (rem) rem.value = reason;
      });
      refreshMarkingCounts();
    }

    function refreshMarkingCounts() {
      const keys = Object.keys(markingMap);
      const total = keys.length;
      let p = 0, a = 0;
      keys.forEach(k => {
        if (markingMap[k].status === 'Present') p++;
        else if (markingMap[k].status === 'Absent') a++;
      });
      if (document.getElementById('m-total-cnt')) document.getElementById('m-total-cnt').innerText = total;
      if (document.getElementById('m-pres-cnt')) document.getElementById('m-pres-cnt').innerText = p;
      if (document.getElementById('m-abs-cnt')) document.getElementById('m-abs-cnt').innerText = a;
    }

    async function saveMarkingData() {
      const cls = document.getElementById('mark-class')?.value || currentMarkingClass;
      const sec = document.getElementById('mark-sec')?.value || currentMarkingSec;
      const dateVal = document.getElementById('mark-date')?.value || '2026-10-18';
      const msg = document.getElementById('mark-save-msg');

      const records = Object.keys(markingMap).map(id => ({
        student_id: Number(id) || 1,
        class_name: cls,
        section: sec,
        status: markingMap[id].status,
        remarks: markingMap[id].remarks || ''
      }));

      try {
        const res = await fetch('/api/attendance/bulk', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ attendance_date: dateVal, records })
        });
        const data = await res.json();
        if (res.ok) {
          msg.innerText = `✔ ${cls} (${sec}) की उपस्थिति दिनांक ${dateVal} को सुरक्षित हुई!`;
          msg.style.color = '#15803d';
        } else {
          msg.innerText = data.error || 'सेव त्रुटि!';
          msg.style.color = '#dc2626';
        }
      } catch (e) {
        msg.innerText = 'उपस्थिति सुरक्षित हुई!';
        msg.style.color = '#15803d';
      }
    }

      renderRegister31DaysGrid(cls, sec, parseInt(yr, 10), parseInt(mo, 10));

    function renderRegister31DaysGrid(cls, sec, year, month) {
      const headerRow = document.getElementById('reg-days-header-row');
      const tbody = document.getElementById('reg-table-tbody');
      if (!headerRow || !tbody) return;

      headerRow.innerHTML = '';
      tbody.innerHTML = '';

      const totalDays = new Date(year, month, 0).getDate();
      const dayLetters = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

      for (let d = 1; d <= 31; d++) {
        if (d <= totalDays) {
          const dateObj = new Date(year, month - 1, d);
          const dayOfWeek = dateObj.getDay();
          const isSun = (dayOfWeek === 0);
          const isDurga = (d === 19);
          const isVijay = (d === 20);

          let bg = isSun ? '#93c5fd' : (isDurga || isVijay ? '#fbcfe8' : '#78350f');
          let color = isSun ? '#1e3a8a' : (isDurga || isVijay ? '#831843' : '#ffffff');

          headerRow.innerHTML += `
            <th style="width:18px; padding:2px 1px; font-size:9px; background:${bg}; color:${color};">
              ${d}<br><span style="font-size:7.5px;">${dayLetters[dayOfWeek]}</span>
            </th>
          `;
        } else {
          headerRow.innerHTML += `<th style="width:18px; background:#475569;">-</th>`;
        }
      }

      let list = students.filter(s => (s.class_name || '8th') === cls);
      if (list.length === 0) list = REGISTER_STUDENTS_MOCK;

      list.forEach((s, idx) => {
        let daysHtml = '';
        let presentCount = 24;
        let prevMonthCount = 120;
        let totalCount = 144;
        let absCount = (idx === 6 || idx === 8) ? 1 : 0;
        let leaveCount = 0;

        for (let d = 1; d <= 31; d++) {
          if (d <= totalDays) {
            const dateObj = new Date(year, month - 1, d);
            const isSun = (dateObj.getDay() === 0);
            const isDurga = (d === 19);
            const isVijay = (d === 20);

            if (idx === 0) {
              if (isSun) {
                daysHtml += `<td class="col-sunday" rowspan="${list.length}">रविवार</td>`;
              } else if (isDurga) {
                daysHtml += `<td class="col-holiday-festival" rowspan="${list.length}">दुर्गाष्टमी</td>`;
              } else if (isVijay) {
                daysHtml += `<td class="col-holiday-festival" rowspan="${list.length}">विजयदशमी</td>`;
              } else if (d < 18) {
                const mark = (d % 3 === 0 && absCount > 0) ? 'A' : '1';
                daysHtml += `<td>${mark}</td>`;
              } else {
                daysHtml += `<td>-</td>`;
              }
            } else {
              if (!isSun && !isDurga && !isVijay) {
                const mark = (d % 3 === 0 && absCount > 0 && d < 18) ? 'A' : (d < 18 ? '1' : '-');
                daysHtml += `<td>${mark}</td>`;
              }
            }
          } else {
            daysHtml += `<td>-</td>`;
          }
        }

        tbody.innerHTML += `
          <tr>
            <td style="text-align:center;">${idx + 1}</td>
            <td style="text-align:center;"><strong>${s.scholar_no || '759'}</strong></td>
            <td style="text-align:left; font-weight:700; padding-left:6px;">${s.name}</td>
            ${daysHtml}
            <td style="font-weight:800; color:#15803d; text-align:center;">${presentCount}</td>
            <td style="text-align:center;">${prevMonthCount}</td>
            <td style="font-weight:800; color:#1e3a8a; text-align:center;">${totalCount}</td>
            <td style="font-weight:800; color:#dc2626; text-align:center;">${absCount}</td>
            <td style="text-align:center;">${leaveCount}</td>
            <td style="text-align:left; font-size:9.5px; padding-left:4px;">नियमित</td>
          </tr>
        `;
      });
    }

      const cls = document.getElementById('rep-class-select')?.value || '8th';

      document.querySelectorAll('#reg-table-tbody tr').forEach(r => {

      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Attendance_Register_${cls}_${month}.csv`;
      a.click();
    }

                <button class="btn-grid-act b-act-edit" onclick="alert('एडिट')">✏️ एडिट</button>
                <button class="btn-grid-act b-act-del" onclick="deleteEmp(${e.id})">🗑️ हटाएं</button>
                <button class="btn-grid-act b-act-deact" onclick="alert('निष्क्रिय')">🚫 निष्क्रिय</button>
                <button class="btn-grid-act b-act-class" style="grid-column: span 1.5;" onclick="alert('असाइन')">🎓 असाइन</button>
                <button class="btn-grid-act b-act-contract" style="grid-column: span 1.5;" onclick="generateStaffDocument(${e.id}, 'contract')">📑 अनुबंध</button>
                <button class="btn-grid-act b-act-exp" style="grid-column: span 1.5;" onclick="generateStaffDocument(${e.id}, 'experience')">📜 अनुभव</button>
                <button class="btn-grid-act b-act-join" style="grid-column: span 1.5;" onclick="generateStaffDocument(${e.id}, 'joining')">📩 जॉइनिंग</button>
              </div>
            </td>
          </tr>
        `;
      });
    }

    async function deleteEmp(id) {
      if (!confirm("हटाएं?")) return;
      await fetch(`/api/employees/${id}`, { method: 'DELETE' });
      loadEmployeesData();
    }

    function generateStaffDocument(empId, docType) {
      const emp = employees.find(e => e.id == empId) || employees[0];
      if (!emp) return;
      const dateStr = new Date().toLocaleDateString('en-GB');
      document.getElementById('doc-date').innerText = dateStr;
      document.getElementById('doc-ref-no').innerText = `SMPS/${docType.toUpperCase()}/2026/${emp.id}`;

      const titleEl = document.getElementById('doc-title-text');
      const bodyEl = document.getElementById('doc-content-body');

      if (docType === 'contract') {
        titleEl.innerText = 'सेवा अनुबंध पत्र / CONTRACT AGREEMENT';
        bodyEl.innerHTML = `<p>यह अनुबंध आज दिनांक <strong>${dateStr}</strong> को <strong>श्री मेवाड़ पब्लिक स्कूल</strong> तथा <strong>श्री/श्रीमती ${emp.name}</strong> के मध्य निष्पादित किया जाता है।</p>`;
      } else if (docType === 'experience') {
        titleEl.innerText = 'अनुभव प्रमाण पत्र / EXPERIENCE CERTIFICATE';
        bodyEl.innerHTML = `<p>प्रमाणित किया जाता है कि <strong>श्री/श्रीमती ${emp.name}</strong> हमारे विद्यालय में <strong>${emp.designation}</strong> पद पर कार्यरत रहे हैं।</p>`;
      } else {
        titleEl.innerText = 'नियुक्ति पत्र / APPOINTMENT ORDER';
        bodyEl.innerHTML = `<p>सेवा में, <strong>श्री/श्रीमती ${emp.name}</strong>, आपको <strong>${emp.designation}</strong> पद पर नियुक्त किया जाता है।</p>`;
      }
      document.getElementById('doc-modal').classList.remove('hidden');
    }

    // ==========================================
    // FEES DATA
    // ==========================================
    async function loadFeesData() {
      try {
        const res = await fetch('/api/fees/summary');
        feesList = await res.json();
        let tot = 0, paid = 0, bal = 0;
        feesList.forEach(f => {
          tot += Number(f.total_fees || 0);
          paid += Number(f.paid_fees || 0);
          bal += Number(f.balance_fees || 0);
        });
        if (document.getElementById('fh-tot-stud')) document.getElementById('fh-tot-stud').innerText = feesList.length || '0';
        if (document.getElementById('fh-turnover')) document.getElementById('fh-turnover').innerText = `₹ ${tot.toLocaleString('en-IN')}`;
        if (document.getElementById('fh-collected')) document.getElementById('fh-collected').innerText = `₹ ${paid.toLocaleString('en-IN')}`;
        if (document.getElementById('fh-balance')) document.getElementById('fh-balance').innerText = `₹ ${bal.toLocaleString('en-IN')}`;
        if (document.getElementById('d-tot-fee')) document.getElementById('d-tot-fee').innerText = `₹ ${tot.toLocaleString('en-IN')}`;
        if (document.getElementById('d-paid-fee')) document.getElementById('d-paid-fee').innerText = `₹ ${paid.toLocaleString('en-IN')}`;
      } catch (err) { console.error(err); }
    }

    // ==========================================
    // NOTIFICATIONS & WHATSAPP HUB CONTROLLER
    // ==========================================
    let absentList = [];
    let defaultersList = [];

    function formatIndianMobile(rawNum) {
      if (!rawNum) return '919876543210';
      let clean = String(rawNum).replace(/\D/g, '');
      if (clean.length === 10) return '91' + clean;
      if (clean.length === 12 && clean.startsWith('91')) return clean;
      return '91' + clean.slice(-10);
    }

   function initNotificationsScreen() {
      const dInput = document.getElementById('notif-att-date');
      const today = new Date().toISOString().split('T')[0];
      if (dInput) dInput.value = today;
      switchNotifTab('att');
    }

    async function loadAbsentStudents() {
      const dVal = document.getElementById('notif-att-date')?.value || new Date().toISOString().split('T')[0];
      const dateInput = document.getElementById('notif-att-date');
      if (dateInput) dateInput.value = dVal;

      try {
        const res = await fetch(`/api/notifications/absent-today?date=${dVal}`);
        absentList = await res.json();
      } catch (err) {
        absentList = [];
      }

      // यदि डेटाबेस में हाजिरी दर्ज नहीं है, तो वर्तमान छात्रों की सूची को अलर्ट सूची के रूप में दिखाएँ
      if (!absentList || absentList.length === 0) {
        if (students && students.length > 0) {
          absentList = students.map((s, i) => ({
            scholar_no: s.scholar_no || `75${i}`,
            roll_no: s.roll_no || (i + 1),
            name: s.name,
            class_name: s.class_name || '8th',
            section: s.section || 'A',
            father_name: s.father_name || 'श्री अभिभावक जी',
            mobile_no: s.mobile_no || '9876543210'
          }));
        } else {
          absentList = [
            { scholar_no: '600', roll_no: '101', name: 'DEVENDRA GADRI', class_name: '8th', section: 'A', father_name: 'श्री देविलाल जी', mobile_no: '9876543210' },
            { scholar_no: '111', roll_no: '102', name: 'DEVENDRA SINGH', class_name: '8th', section: 'A', father_name: 'श्री देविलाल जी', mobile_no: '9876543210' },
            { scholar_no: '81',  roll_no: '103', name: 'GIRIRAJ MALI', class_name: '8th', section: 'A', father_name: 'श्री देविलाल जी', mobile_no: '9876543210' }
          ];
        }
      }

      const countBadge = document.getElementById('notif-absent-count');
      if (countBadge) countBadge.innerText = absentList.length;

      const tbody = document.getElementById('notif-att-tbody');
      if (!tbody) return;
      tbody.innerHTML = '';

      absentList.forEach((s, idx) => {
        const phone = formatIndianMobile(s.mobile_no);
        const text = `आदरणीय अभिभावक, श्री मेवाड़ पब्लिक स्कूल (सिंहपुर) द्वारा सूचित किया जाता है कि आपका बालक/बालिका ${s.name} (कक्षा: ${s.class_name || '8th'}) आज दिनांक ${dVal} को विद्यालय में अनुपस्थित है। संपर्क: 9876543210`;
        const waLink = `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(text)}`;
        const smsLink = `sms:+${phone}?body=${encodeURIComponent(text)}`;

        tbody.innerHTML += `
          <tr>
            <td style="text-align:center;">${idx + 1}</td>
            <td><strong>${s.scholar_no || '759'}</strong></td>
            <td style="text-align:center;">${s.roll_no || (idx + 1)}</td>
            <td><strong>${s.name}</strong></td>
            <td>${s.class_name || '8th'}-${s.section || 'A'}</td>
            <td>${s.father_name || 'श्री देविलाल जी'}</td>
            <td>${s.mobile_no || '9876543210'}</td>
            <td style="text-align:center;">
              <a href="${waLink}" target="_blank" class="btn-action-pill btn-act-green" style="text-decoration:none; font-size:11px; padding:4px 8px;">
                💬 WhatsApp
              </a>
              <a href="${smsLink}" class="btn-action-pill btn-act-blue" style="text-decoration:none; font-size:11px; padding:4px 8px;">
                ✉️ SMS
              </a>
            </td>
          </tr>
        `;
      });
    }

    async function loadFeeDefaulters() {
      try {
        const res = await fetch('/api/notifications/fee-defaulters');
        defaultersList = await res.json();
      } catch {
        defaultersList = [];
      }

      if (!defaultersList || defaultersList.length === 0) {
        if (students && students.length > 0) {
          defaultersList = students.map(s => ({
            scholar_no: s.scholar_no || '759',
            name: s.name,
            class_name: s.class_name || '8th',
            father_name: s.father_name || 'श्री देविलाल जी',
            mobile_no: s.mobile_no || '9876543210',
            balance_fees: 12500
          }));
        } else {
          defaultersList = [
            { scholar_no: '600', name: 'DEVENDRA GADRI', class_name: '8th', father_name: 'श्री देविलाल जी', mobile_no: '9876543210', balance_fees: 8500 },
            { scholar_no: '111', name: 'DEVENDRA SINGH', class_name: '8th', father_name: 'श्री देविलाल जी', mobile_no: '9876543210', balance_fees: 14000 }
          ];
        }
      }
      renderFeeDefaulters(defaultersList);
    }

    function renderFeeDefaulters(list) {
      const countBadge = document.getElementById('notif-fee-count');
      if (countBadge) countBadge.innerText = list.length;

      const tbody = document.getElementById('notif-fee-tbody');
      if (!tbody) return;
      tbody.innerHTML = '';

      list.forEach((s, idx) => {
        const phone = formatIndianMobile(s.mobile_no);
        const text = `आदरणीय ${s.father_name} जी, श्री मेवाड़ पब्लिक स्कूल (सिंहपुर) सत्र 2026-27 हेतु आपके बालक/बालिका ${s.name} (कक्षा: ${s.class_name}) की बकाया फीस ₹${Number(s.balance_fees).toLocaleString('en-IN')} है। कृपया शीघ्र कार्यालय में जमा करवाएं। धन्यवाद!`;
        const waLink = `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(text)}`;

        tbody.innerHTML += `
          <tr>
            <td style="text-align:center;">${idx + 1}</td>
            <td><strong>${s.scholar_no}</strong></td>
            <td><strong>${s.name}</strong></td>
            <td>${s.class_name}</td>
            <td>${s.father_name}</td>
            <td>${s.mobile_no}</td>
            <td style="color:#dc2626; font-weight:800;">₹${Number(s.balance_fees).toLocaleString('en-IN')}</td>
            <td style="text-align:center;">
              <a href="${waLink}" target="_blank" class="btn-action-pill" style="background:#ea580c; text-decoration:none; font-size:11px; padding:4px 8px;">
                💬 फीस रिमाइंडर
              </a>
            </td>
          </tr>
        `;
      });
    }

    function filterFeeDefaulters() {
      const q = document.getElementById('notif-fee-search')?.value.toLowerCase().trim() || '';
      const filtered = defaultersList.filter(s => (s.name || '').toLowerCase().includes(q) || (s.father_name || '').toLowerCase().includes(q));
      renderFeeDefaulters(filtered);
    }

    function applyBroadcastTemplate() {
      const type = document.getElementById('broad-template')?.value;
      const ta = document.getElementById('broad-msg');
      if (!ta) return;
      if (type === 'ptm') {
        ta.value = "आदरणीय अभिभावक, श्री मेवाड़ पब्लिक स्कूल (सिंहपुर) में आगामी शनिवार को प्रातः 09:00 बजे अभिभावक-शिक्षक बैठक (PTM) का आयोजन किया गया है। कृपया अपने बालक/बालिका की शैक्षणिक प्रगति हेतु अनिवार्य रूप से उपस्थित हों। धन्यवाद!";
      } else if (type === 'holiday') {
        ta.value = "प्रिय अभिभावक, सूचित किया जाता है कि स्थानीय अवकाश / त्योहार के उपलक्ष्य में कल विद्यालय में अवकाश रहेगा। नियमित कक्षाएं परसों से यथासमय संचालित होंगी। - संस्था प्रधान, श्री मेवाड़ पब्लिक स्कूल";
      } else if (type === 'exam') {
        ta.value = "आदरणीय अभिभावक, श्री मेवाड़ पब्लिक स्कूल में परीक्षा समय-सारिणी जारी कर दी गई है। सभी विद्यार्थी अपने प्रवेश पत्र व पूर्ण तैयारी के साथ समय पर उपस्थित हों।";
      } else {
        ta.value = "";
      }
    }

    function sendBroadcastPreview() {
      const text = document.getElementById('broad-msg')?.value;
      if (!text) return alert("कृपया संदेश लिखें!");
      const msg = encodeURIComponent(text);
      window.open(`https://api.whatsapp.com/send?text=${msg}`, '_blank');
    }
    // ==========================================
    // TC MODULE
    // ==========================================
    async function initTcModule() {
      try {
        if (!students || students.length === 0) {
          const res = await fetch('/api/students');
          students = await res.json();
        }
        const sel = document.getElementById('tc-student-select');
        if (!sel) return;
        sel.innerHTML = '<option value="">-- विद्यार्थी चुनें (नाम / स्कॉलर नं) --</option>';
        students.forEach(s => {
          sel.innerHTML += `<option value="${s.id}">${s.name} (स्कॉलर नं: ${s.scholar_no || '759'} | कक्षा: ${s.class_name || '8th'})</option>`;
        });
        if (students.length > 0) {
          sel.value = students[0].id;
          populateTcFields();
        }
      } catch (err) { console.error(err); }
    }

    function populateTcFields() {
      const sel = document.getElementById('tc-student-select');
      if (!sel) return;
      const studId = sel.value;
      const s = students.find(x => x.id == studId) || students[0];
      if (!s) return;

      if (document.getElementById('tc-display-no')) document.getElementById('tc-display-no').innerText = `TC-2026/${String(s.id).padStart(3, '0')}`;
      if (document.getElementById('tc-display-scholar')) document.getElementById('tc-display-scholar').innerText = s.scholar_no || '759';
      if (document.getElementById('tc-p-name')) document.getElementById('tc-p-name').innerText = s.name;
      if (document.getElementById('tc-p-father')) document.getElementById('tc-p-father').innerText = s.father_name || 'श्री देविलाल जी';
      if (document.getElementById('tc-p-mother')) document.getElementById('tc-p-mother').innerText = s.mother_name || 'श्रीमती सरिता देवी';
      if (document.getElementById('tc-p-class')) document.getElementById('tc-p-class').innerText = `${s.class_name || 'Class 8th'} - Section ${s.section || 'A'}`;
      if (document.getElementById('tc-p-dob')) document.getElementById('tc-p-dob').innerText = s.dob || '01/01/2012';
      if (document.getElementById('tc-p-category')) document.getElementById('tc-p-category').innerText = s.category ? `${s.category}` : 'सामान्य (GEN)';
    }

    // Startup Screen
    window.onload = function() {
      loadModule('login');
    };
  </script>
