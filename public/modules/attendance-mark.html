<div class="directory-container">
  <!-- Top Navigation & Heading -->
  <div style="background:#991b1b; color:white; padding:10px 16px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-weight:800;">
    <div style="font-size:15px; letter-spacing:0.5px;">🌸 दैनिक उपस्थिति मार्किंग (Daily Attendance) 🌸</div>
    <div style="display:flex; gap:8px;">
      <button class="btn-action-pill" style="background:#0284c7; padding:5px 12px; font-size:11.5px;" onclick="loadModule('attendance')">📑 Attendance Report / Register</button>
      <button class="btn-action-pill btn-act-orange" style="padding:5px 12px; font-size:11.5px;" onclick="loadModule('attendance')">⬅ कमांड सेंटर</button>
    </div>
  </div>

  <!-- Filters & Quick Actions -->
  <div class="filter-panel" style="justify-content:space-between;">
    <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
      <label style="font-size:12px; font-weight:700; color:#475569;">
        तारीख: 
        <input type="date" id="mark-date" class="filter-control" style="font-weight:700;" onchange="renderMarkingTable()">
      </label>

      <label style="font-size:12px; font-weight:700; color:#475569;">
        कक्षा: 
        <select id="mark-class" class="filter-control" style="font-weight:700;" onchange="renderMarkingTable()">
          <option value="Pp.3+">Pp.3+</option>
          <option value="Pp.4+">Pp.4+</option>
          <option value="Pp.5+">Pp.5+</option>
          <option value="1st">1st</option>
          <option value="2nd">2nd</option>
          <option value="3rd">3rd</option>
          <option value="4th">4th</option>
          <option value="5th">5th</option>
          <option value="6">6th</option>
          <option value="7th">7th</option>
          <option value="8th">8th</option>
          <option value="Class 10-A" selected>Class 10-A</option>
        </select>
      </label>

      <label style="font-size:12px; font-weight:700; color:#475569;">
        सेक्शन: 
        <select id="mark-sec" class="filter-control" style="font-weight:700;" onchange="renderMarkingTable()">
          <option value="A">Section A</option>
          <option value="B">Section B</option>
        </select>
      </label>
    </div>

    <!-- 1-Click Bulk Toggles -->
    <div style="display:flex; gap:8px;">
      <button class="btn-action-pill btn-act-green" onclick="setAllMarking('Present')">✔ सभी को Present करें</button>
      <button class="btn-action-pill btn-act-red" onclick="setAllMarking('Absent')">✖ सभी को Absent करें</button>
    </div>
  </div>

  <!-- Summary Pills for Selected Class -->
  <div class="summary-badges-bar" style="margin-bottom:12px;">
    <span class="sum-badge" style="background:#0284c7;">👥 कुल छात्र: <span id="m-total-cnt">0</span></span>
    <span class="sum-badge" style="background:#16a34a;">✔ उपस्थित (Present): <span id="m-pres-cnt">0</span></span>
    <span class="sum-badge" style="background:#dc2626;">✖ अनुपस्थित (Absent): <span id="m-abs-cnt">0</span></span>
  </div>

  <!-- Attendance Marking Table -->
  <div class="table-responsive">
    <table class="custom-table">
      <thead>
        <tr>
          <th style="width:40px; text-align:center;">क्र.</th>
          <th>कक्षा-सेक्शन</th>
          <th style="width:80px; text-align:center;">रोल नं.</th>
          <th>छात्र का नाम</th>
          <th style="width:160px; text-align:center;">उपस्थिति स्थिति (Status)</th>
          <th>टिप्पणी / रिमार्क</th>
          <th style="width:100px; text-align:center;">एक्शन</th>
        </tr>
      </thead>
      <tbody id="mark-tbody"></tbody>
    </table>
  </div>

  <!-- Bottom Save Bar -->
  <div style="text-align:center; margin:24px 0 30px;">
    <button class="btn-action-pill btn-act-green" style="padding:14px 44px; font-size:15px; box-shadow:0 4px 12px rgba(22,163,74,0.3);" onclick="saveMarkingData()">
      💾 उपस्थिति सुरक्षित सेव करें (Save Attendance)
    </button>
    <div id="mark-save-msg" style="margin-top:10px; font-weight:800; font-size:13.5px;"></div>
  </div>
</div>
