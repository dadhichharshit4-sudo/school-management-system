<div class="directory-container">
  <div class="emp-panel-card">
    <div class="emp-section-title"><span>📑</span> कर्मचारी प्रबंधन के कार्य</div>
    <div class="emp-actions-bar">
      <button class="emp-act-btn btn-green-emp" onclick="openAddEmpPrompt()">👤+ नया कर्मचारी जोड़ें</button>
      <button class="emp-act-btn btn-brown-emp">💳 वेतन प्रबंधन</button>
      <button class="emp-act-btn btn-blue-emp" onclick="loadModule('attendance')">✔ उपस्थिति</button>
      <button class="emp-act-btn btn-rose-emp" onclick="openStaffIdCardModal(employees[0]?.id)">🪪 ID कार्ड जनरेट करें</button>
      <button class="emp-act-btn btn-sky-emp">📘 Assign Subjects</button>
      <button class="emp-act-btn btn-indigo-emp">👤 शिक्षक इन्क्वायरी</button>
      <button class="emp-act-btn btn-wine-emp">📑 सभी शिक्षकों की सूची ↗</button>
    </div>

    <div class="emp-stats-bar">
      <span class="emp-stat-pill" style="background:#0284c7;">👤 पुरुष: <span id="st-emp-male">0</span></span>
      <span class="emp-stat-pill" style="background:#db2777;">👩 महिला: <span id="st-emp-fem">0</span></span>
      <span class="emp-stat-pill" style="background:#7c2d12;">👥 कुल कर्मचारी: <span id="st-emp-tot">0</span></span>
      <span class="emp-stat-pill" style="background:#0d9488;">👨‍🏫 शिक्षक: <span id="st-emp-teach">0</span></span>
      <span class="emp-stat-pill" style="background:#dc2626;">⚙️ गैर-शिक्षक: <span id="st-emp-non">0</span></span>
    </div>
  </div>

  <div class="emp-panel-card">
    <div class="emp-section-title"><span>👥</span> वर्तमान कर्मचारियों की सूची</div>
    <div class="emp-search-container">
      <span class="emp-search-icon">🔍</span>
      <input type="text" id="emp-search-box" class="emp-search-input" placeholder="कर्मचारी खोजें (नाम, कोड, पद, मोबाइल नंबर से)..." onkeyup="filterEmployees()">
      <span class="emp-total-badge" id="emp-total-badge">Total: 0</span>
    </div>

    <div class="table-responsive">
      <table class="custom-table emp-table">
        <thead>
          <tr>
            <th>ID</th><th>PHOTO</th><th>नाम</th><th>पद</th><th>CODE</th><th>प्रकार</th><th>मोबाइल</th>
            <th>ईमेल</th><th>ज्वाइनिंग</th><th>क्लास टीचर</th><th>दस्तावेज़</th><th>स्थिति</th><th>कार्यवाही</th>
          </tr>
        </thead>
        <tbody id="emp-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
