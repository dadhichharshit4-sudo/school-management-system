<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>स्कूल मैनेजमेंट सिस्टम</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .mobile-frame { width: 100%; max-width: 420px; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; min-height: 580px; display: flex; flex-direction: column; }
    .header { background: #1a73e8; color: white; padding: 18px; }
    .content { padding: 18px; flex-grow: 1; overflow-y: auto; max-height: 80vh; }
    .nav-tabs { display: flex; gap: 6px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 8px; border: 1px solid #1a73e8; background: white; color: #1a73e8; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .tab-btn.active { background: #1a73e8; color: white; }
    .form-group { margin-bottom: 10px; }
    input, textarea { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 8px; font-size: 13px; outline: none; }
    button.primary-btn { width: 100%; padding: 11px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .notice-card { background: #e8f0fe; border-left: 4px solid #1a73e8; padding: 12px; border-radius: 6px; margin-bottom: 12px; }
    .notice-title { font-weight: bold; color: #1a73e8; font-size: 15px; }
    .notice-desc { font-size: 13px; color: #333; margin-top: 4px; }
    .notice-date { font-size: 11px; color: #777; margin-top: 6px; text-align: right; }
    .hidden { display: none !important; }
    .user-badge { background: #e6f4ea; color: #137333; padding: 4px 8px; border-radius: 12px; font-size: 12px; display: inline-block; margin-bottom: 12px; font-weight: 600; }
    .admin-box { background: #fdf2e9; border: 1px dashed #e67e22; border-radius: 10px; padding: 12px; margin-bottom: 15px; }
    .student-box { background: #eef5fc; border: 1px dashed #1a73e8; border-radius: 10px; padding: 12px; margin-bottom: 15px; }
    .student-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f9f9f9; border-radius: 8px; margin-bottom: 8px; border: 1px solid #eee; }
    .fee-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .badge-paid { background: #e6f4ea; color: #137333; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-partial { background: #fef7e0; color: #b06000; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-pending { background: #fce8e6; color: #c5221f; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
  </style>
</head>
<body>

<div class="mobile-frame">
  <!-- लॉगिन स्क्रीन -->
  <div id="login-screen">
    <div class="header" style="text-align: center;">
      <h2>स्कूल ऐप लॉगिन</h2>
      <p style="font-size: 12px; margin-top: 4px;">Admin / Teacher / Student</p>
    </div>
    <div class="content">
      <div class="form-group">
        <label style="font-size: 13px; font-weight: 600;">ईमेल</label>
        <input type="email" id="login-email" value="admin@school.com">
      </div>
      <div class="form-group">
        <label style="font-size: 13px; font-weight: 600;">पासवर्ड</label>
        <input type="password" id="login-password" value="admin123">
      </div>
      <button class="primary-btn" onclick="handleLogin()">लॉगिन करें</button>
      <p id="login-msg" style="color: red; font-size: 13px; margin-top: 10px; text-align: center;"></p>
    </div>
  </div>

  <!-- डैशबोर्ड स्क्रीन -->
  <div id="dashboard-screen" class="hidden">
    <div class="header" style="display: flex; justify-content: space-between; align-items: center;">
      <h3 id="welcome-name">डैशबोर्ड</h3>
      <a href="#" onclick="handleLogout()" style="color: white; font-size: 12px; text-decoration: underline;">लॉगआउट</a>
    </div>

    <div class="content">
      <div id="user-role-badge" class="user-badge"></div>

      <!-- नेविगेशन टैब्स -->
      <div class="nav-tabs">
        <button id="tab-notices-btn" class="tab-btn active" onclick="switchTab('notices')">नोटिस</button>
        <button id="tab-attendance-btn" class="tab-btn" onclick="switchTab('attendance')">अटेंडेंस</button>
        <button id="tab-fees-btn" class="tab-btn" onclick="switchTab('fees')">फीस</button>
      </div>

      <!-- 1. नोटिस सेक्शन -->
      <div id="section-notices">
        <div id="create-notice-section" class="admin-box hidden">
          <h5 style="color: #d35400; margin-bottom: 8px;">+ नया नोटिस जारी करें</h5>
          <div class="form-group"><input type="text" id="new-notice-title" placeholder="नोटिस का शीर्षक"></div>
          <div class="form-group"><textarea id="new-notice-desc" rows="2" placeholder="विवरण..."></textarea></div>
          <button class="primary-btn" style="background: #e67e22;" onclick="handleCreateNotice()">नोटिस पोस्ट करें</button>
        </div>
        <div id="notices-container">लोड हो रहा है...</div>
      </div>

      <!-- 2. अटेंडेंस और छात्र प्रबंधन सेक्शन -->
      <div id="section-attendance" class="hidden">
        <!-- केवल एडमिन के लिए नया छात्र जोड़ने का फॉर्म -->
        <div id="add-student-section" class="student-box hidden">
          <h5 style="color: #1a73e8; margin-bottom: 8px;">+ नया छात्र प्रवेश (Add Student)</h5>
          <div class="form-group"><input type="number" id="new-stud-roll" placeholder="रोल नंबर (उदा. 104)"></div>
          <div class="form-group"><input type="text" id="new-stud-name" placeholder="छात्र का नाम"></div>
          <div class="form-group"><input type="text" id="new-stud-class" value="Class 10-A" placeholder="कक्षा"></div>
          <div class="form-group"><input type="number" id="new-stud-fee" value="20000" placeholder="कुल वार्षिक फीस (₹)"></div>
          <button class="primary-btn" onclick="handleAddStudent()">छात्र सेव करें</button>
          <p id="student-add-msg" style="font-size: 12px; margin-top: 6px; text-align: center;"></p>
        </div>

        <h4 id="att-heading" style="margin-bottom: 12px; color: #333;">कक्षा 10-A की हाजिरी</h4>
        <div id="students-list">लोड हो रहा है...</div>
        <div id="att-submit-box">
          <button class="primary-btn" style="margin-top: 12px; background: #2e7d32;" onclick="submitAttendance()">हाजिरी सबमिट करें</button>
          <p id="att-msg" style="font-size: 13px; margin-top: 8px; text-align: center;"></p>
        </div>
      </div>

      <!-- 3. फीस सेक्शन -->
      <div id="section-fees" class="hidden">
        <h4 id="fee-heading" style="margin-bottom: 12px; color: #333;">फीस विवरण</h4>
        <div id="fees-container">लोड हो रहा है...</div>
      </div>
    </div>
  </div>
</div>

<script>
  let currentUser = null;
  let studentsData = [];

  async function handleLogin() {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        currentUser = data.user;
        showDashboard(data.user);
      } else {
        document.getElementById('login-msg').innerText = data.error || 'लॉगिन विफल!';
      }
    } catch {
      document.getElementById('login-msg').innerText = 'सर्वर से कनेक्शन विफल!';
    }
  }

  function showDashboard(user) {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('dashboard-screen').classList.remove('hidden');
    document.getElementById('welcome-name').innerText = user.name;
    document.getElementById('user-role-badge').innerText = `रोल: ${user.role.toUpperCase()}`;

    if (user.role === 'admin') {
      document.getElementById('create-notice-section').classList.remove('hidden');
      document.getElementById('add-student-section').classList.remove('hidden');
      document.getElementById('att-submit-box').classList.remove('hidden');
      document.getElementById('att-heading').innerText = 'कक्षा 10-A की हाजिरी दर्ज करें';
      document.getElementById('fee-heading').innerText = 'सभी छात्र फीस रिकॉर्ड (Admin)';
    } else if (user.role === 'teacher') {
      document.getElementById('create-notice-section').classList.remove('hidden');
      document.getElementById('add-student-section').classList.add('hidden');
      document.getElementById('att-submit-box').classList.remove('hidden');
      document.getElementById('att-heading').innerText = 'कक्षा 10-A की हाजिरी दर्ज करें';
      document.getElementById('fee-heading').innerText = 'सभी छात्र फीस रिकॉर्ड';
    } else {
      document.getElementById('create-notice-section').classList.add('hidden');
      document.getElementById('add-student-section').classList.add('hidden');
      document.getElementById('att-submit-box').classList.add('hidden');
      document.getElementById('att-heading').innerText = 'आपकी उपस्थिति स्टेटस';
      document.getElementById('fee-heading').innerText = 'मेरी फीस का विवरण';
    }

    loadNotices();
    loadStudents();
    loadFees();
  }

  function switchTab(tab) {
    ['notices', 'attendance', 'fees'].forEach(t => {
      document.getElementById(`section-${t}`).classList.add('hidden');
      document.getElementById(`tab-${t}-btn`).classList.remove('active');
    });
    document.getElementById(`section-${tab}`).classList.remove('hidden');
    document.getElementById(`tab-${tab}-btn`).classList.add('active');
  }

  async function loadNotices() {
    const container = document.getElementById('notices-container');
    const res = await fetch('/api/notices');
    const notices = await res.json();
    container.innerHTML = '';
    notices.forEach(n => {
      const d = new Date(n.date).toLocaleDateString('hi-IN');
      container.innerHTML += `
        <div class="notice-card">
          <div class="notice-title">${n.title}</div>
          <div class="notice-desc">${n.description}</div>
          <div class="notice-date">दिनांक: ${d}</div>
        </div>`;
    });
  }

  async function handleCreateNotice() {
    const title = document.getElementById('new-notice-title').value.trim();
    const description = document.getElementById('new-notice-desc').value.trim();
    if (!title || !description) return;
    const res = await fetch('/api/notices', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, description })
    });
    if (res.ok) {
      document.getElementById('new-notice-title').value = '';
      document.getElementById('new-notice-desc').value = '';
      loadNotices();
    }
  }

  async function loadStudents() {
    const container = document.getElementById('students-list');
    try {
      const res = await fetch('/api/students');
      studentsData = await res.json();
      container.innerHTML = '';

      let listToShow = studentsData;
      if (currentUser && currentUser.role === 'student') {
        listToShow = studentsData.filter(s => s.name.toLowerCase() === currentUser.name.toLowerCase());
      }

      listToShow.forEach(s => {
        container.innerHTML += `
          <div class="student-row">
            <div class="student-info">
              <strong>${s.name}</strong><br>
              <span style="font-size: 11px; color: #666;">रोल: ${s.roll_no} | ${s.class_name}</span>
            </div>
            ${currentUser.role !== 'student' ? `
              <div>
                <label><input type="radio" name="att_${s.id}" value="Present" checked> P</label>
                <label style="margin-left: 6px;"><input type="radio" name="att_${s.id}" value="Absent"> A</label>
              </div>
            ` : `<span class="badge-paid" style="font-size:12px;">हाजिरी दर्ज</span>`}
          </div>`;
      });
    } catch {
      container.innerHTML = 'छात्र डेटा लोड नहीं हो सका!';
    }
  }

  async function handleAddStudent() {
    const roll_no = document.getElementById('new-stud-roll').value;
    const name = document.getElementById('new-stud-name').value.trim();
    const class_name = document.getElementById('new-stud-class').value.trim();
    const total_fees = document.getElementById('new-stud-fee').value;
    const msg = document.getElementById('student-add-msg');

    if (!roll_no || !name || !class_name) {
      msg.style.color = 'red';
      msg.innerText = 'कृपया सभी विवरण भरें!';
      return;
    }

    try {
      const res = await fetch('/api/students', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ roll_no, name, class_name, total_fees })
      });
      const data = await res.json();
      if (res.ok) {
        msg.style.color = 'green';
        msg.innerText = data.message;
        document.getElementById('new-stud-roll').value = '';
        document.getElementById('new-stud-name').value = '';
        loadStudents();
        loadFees();
      } else {
        msg.style.color = 'red';
        msg.innerText = data.error;
      }
    } catch {
      msg.style.color = 'red';
      msg.innerText = 'छात्र जोड़ने में सर्वर त्रुटि!';
    }
  }

  async function submitAttendance() {
    const attendanceData = studentsData.map(s => ({
      student_id: s.id,
      status: document.querySelector(`input[name="att_${s.id}"]:checked`).value
    }));
    const msg = document.getElementById('att-msg');
    try {
      const res = await fetch('/api/attendance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ attendanceData })
      });
      const data = await res.json();
      msg.style.color = res.ok ? 'green' : 'red';
      msg.innerText = data.message || data.error;
    } catch {
      msg.style.color = 'red';
      msg.innerText = 'हाजिरी सबमिट विफल!';
    }
  }

  async function loadFees() {
    const container = document.getElementById('fees-container');
    try {
      const res = await fetch('/api/fees');
      const fees = await res.json();
      container.innerHTML = '';

      let listToShow = fees;
      if (currentUser && currentUser.role === 'student') {
        listToShow = fees.filter(f => f.name.toLowerCase() === currentUser.name.toLowerCase());
      }

      listToShow.forEach(f => {
        const pending = Number(f.total_amount) - Number(f.paid_amount);
        let badgeClass = 'badge-pending';
        let badgeText = 'बकाया';
        if (f.status === 'Paid') { badgeClass = 'badge-paid'; badgeText = 'पूर्ण जमा'; }
        else if (f.status === 'Partial') { badgeClass = 'badge-partial'; badgeText = 'आंशिक जमा'; }

        container.innerHTML += `
          <div class="fee-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong>${f.name} (रोल: ${f.roll_no})</strong>
              <span class="${badgeClass}">${badgeText}</span>
            </div>
            <div style="font-size: 13px; color: #555; margin-top: 6px;">
              कुल: ₹${f.total_amount} | जमा: ₹${f.paid_amount} | <strong>बकाया: ₹${pending}</strong>
            </div>
            ${currentUser.role !== 'student' && pending > 0 ? `
              <div style="display:flex; gap:6px; margin-top:8px;">
                <input type="number" id="pay_amt_${f.student_id}" placeholder="राशि दर्ज करें" style="padding:6px; font-size:12px;">
                <button style="padding:6px 12px; background:#1a73e8; color:white; border:none; border-radius:6px; cursor:pointer;" onclick="payFee(${f.student_id})">जमा करें</button>
              </div>
            ` : ''}
          </div>`;
      });
    } catch {
      container.innerHTML = 'फीस डेटा लोड नहीं हो सका!';
    }
  }

  async function payFee(studentId) {
    const input = document.getElementById(`pay_amt_${studentId}`);
    const amount = input.value;
    if (!amount || amount <= 0) return alert('कृपया वैध राशि दर्ज करें!');

    const res = await fetch('/api/fees/pay', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ student_id: studentId, amount })
    });
    if (res.ok) {
      loadFees();
    } else {
      alert('भुगतान रिकॉर्ड करने में विफल!');
    }
  }

  function handleLogout() {
    currentUser = null;
    document.getElementById('dashboard-screen').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
  }
</script>

</body>
</html>
